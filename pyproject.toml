[project]
name = "StreamCap"
version = "1.0.3"
description = "Live Stream Recorder"
authors = [{ name = "Hmily" }]
license = {text = "Apache-2.0"}
readme = "README.md"
url='https://github.com/ihmily/StreamCap'
requires-python = ">=3.12,<4.0"

dependencies = [
    "flet[desktop,web,cli]==1.1.2",
    "flet-video==1.1.2",
    "fastapi==0.162.5",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx[http2]==0.28.1",
    "screeninfo==0.8.1",
    "aiofiles==25.1.0",
    "streamget @ git+https://github.com/ihmily/streamget.git@016a8d6fbef4f5f14c0ec986dc3528c5a22235ab",
    "python-dotenv==1.2.4",
    "cachetools==8.0.0",
    "deprecated==3.0.1",
    "loguru==0.8.0",
    "PyExecJS==1.5.1",
    "distro==1.9.0",
    "pystray==0.19.5",
    "plyer==2.1.0",
    "pillow==13.0.0"
]

[project.urls]
Documentation = "https://github.com/ihmily/StreamCap/wiki"
Homepage = "https://github.com/ihmily/StreamCap"
Source = "https://github.com/ihmily/StreamCap"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.flet]
org = "io.github.ihmily.streamcap"
product = "StreamCap"
company = "io.github.ihmily.streamcap"
copyright = "Copyright (C) 2025 by Hmily"
compile.app = false
compile.packages = false
compile.cleanup = true

[tool.flet.app]
path ="."

[tool.poetry]
package-mode = false
packages = [
    { include = "app", from = "." },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
flet = { version = "1.1.2", extras = ["desktop", "web", "cli"] }
flet-video = "==1.1.2"
fastapi = "==0.162.5"
starlette = "==1.10.0"
uvicorn = "==0.54.0"
httpx = { version = "0.28.1", extras = ["http2"] }
screeninfo = "==0.8.1"
aiofiles = "==25.1.0"
streamget = { git = "https://github.com/ihmily/streamget.git", rev = "016a8d6fbef4f5f14c0ec986dc3528c5a22235ab" }
python-dotenv = "==1.2.4"
cachetools = "==8.0.0"
deprecated = "==3.0.1"
loguru = "==0.8.0"
PyExecJS = "==1.5.1"
distro = "==1.9.0"
pystray = "==0.19.5"
plyer = "==2.1.0"
pillow = "==13.0.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "==0.17.4"
